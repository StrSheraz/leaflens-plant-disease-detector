{% extends 'base.html' %}

{% block pagetitle %}
404 – Page Not Found
{% endblock pagetitle %}

{% block body %}
<div class="container mt-5 mb-5 text-center">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h1 style="font-size: 8rem; color: #042908; font-weight: bold;">404</h1>
            <h3 style="color: #333;">Page Not Found</h3>
            <p style="color: #666; font-size: 1.1rem;">The page you are looking for does not exist.</p>
            <a href="/" class="btn btn-success mt-3"
                style="background-color: #042908; border-color: #042908; padding: 10px 30px; font-weight: bold; border-radius: 10px;">
                🏠 Go to Home
            </a>
        </div>
    </div>
</div>
{% endblock body %}
